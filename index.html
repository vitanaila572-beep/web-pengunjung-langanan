<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
    body{background:#f5f7fb;color:#333;}

    header{
      background:#2563eb;
      color:white;
      padding:15px 10%;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:18px;
    }

    .hero{
      text-align:center;
      padding:70px 20px;
    }

    .hero h1{font-size:36px;margin-bottom:15px;}
    .hero p{color:#666;max-width:500px;margin:auto;}

    .btn{
      display:inline-block;
      margin-top:25px;
      background:#2563eb;
      color:white;
      padding:12px 22px;
      border-radius:8px;
      text-decoration:none;
    }

    .fitur{
      display:flex;
      justify-content:center;
      gap:20px;
      padding:40px 10%;
      flex-wrap:wrap;
    }

    .card{
      background:white;
      width:220px;
      padding:20px;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,.1);
      text-align:center;
    }

    footer{
      text-align:center;
      padding:20px;
      color:#777;
    }
  </style>
</head>

<body>

<header>
  <h2>NEXORA</h2>
  <nav>
    <a href="#">Home</a>
    <a href="#">Harga</a>
    <a href="#">Login</a>
  </nav>
</header>

<section class="hero">
  <h1>Belajar Lebih Mudah</h1>
  <p>Platform belajar dengan materi lengkap, latihan soal, dan fitur premium.</p>

  <a href="#" class="btn">Mulai Berlangganan</a>
</section>

<section class="fitur">
  <div class="card">
    <h3>📚 Materi</h3>
    <p>Akses kapan saja.</p>
  </div>

  <div class="card">
    <h3>🤖 AI</h3>
    <p>Bantu jawab soal.</p>
  </div>

  <div class="card">
    <h3>📝 Quiz</h3>
    <p>Latihan & nilai otomatis.</p>
  </div>
</section>

<footer>
  © 2026 Nexora
</footer>

</body>
</html>
