<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Nexora</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{
      background:#f4f7fb;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .login-box{
      background:#fff;
      width:340px;
      padding:30px;
      border-radius:12px;
      box-shadow:0 4px 12px rgba(0,0,0,.1);
    }
    h2{text-align:center;color:#2563eb;margin-bottom:8px}
    .sub{text-align:center;color:#666;font-size:14px;margin-bottom:20px}
    input{
      width:100%;
      padding:12px;
      margin-bottom:15px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:14px;
    }
    button{
      width:100%;
      padding:12px;
      background:#2563eb;
      color:#fff;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:15px;
    }
    .link{
      text-align:center;
      margin-top:18px;
      font-size:14px;
    }
    .link a{
      color:#2563eb;
      text-decoration:none;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login</h2>
    <p class="sub">Masuk ke akun Nexora</p>

    <form id="loginForm">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Masuk</button>
    </form>

    <div class="link">
      Belum punya akun?
      <a href="register.html">Daftar</a>
    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import { signInWithEmailAndPassword }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = form.elements["email"].value;
      const password = form.elements["password"].value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "dashboard.html";
      } catch (error) {
        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
        ) {
          alert("❌ Email atau password salah!");
        } else {
          alert("⚠️ Terjadi kesalahan, silakan coba lagi.");
        }
      }
    });
  </script>

</body>
</html>
