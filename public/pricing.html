<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing - Nexora</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f4f7fb;color:#333}
header{background:#2563eb;color:#fff;padding:15px;text-align:center}
h1{text-align:center;margin:40px 0 10px}
p{text-align:center;color:#666;margin-bottom:30px}

.container{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
  padding:20px;
}

.card{
  background:#fff;
  width:260px;
  padding:25px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.premium{
  border:2px solid #2563eb;
}

.price{
  font-size:30px;
  color:#2563eb;
  margin:15px 0;
}

ul{list-style:none;margin:20px 0}
li{margin:8px 0}

.btn{
  display:block;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  padding:12px;
  border-radius:8px;
}

footer{
  text-align:center;
  color:#777;
  padding:25px;
}
</style>
</head>

<body>

<header>
  <h2>NEXORA</h2>
</header>

<h1>Pilih Paketmu</h1>
<p>Mulai gratis dan upgrade kapan saja.</p>

<div class="container">

  <div class="card">
    <h3>FREE</h3>
    <div class="price">Rp0</div>
    <ul>
      <li>✓ Materi Dasar</li>
      <li>✓ 5 Quiz</li>
      <li>✗ AI Premium</li>
    </ul>
    <a href="register.html" class="btn">Daftar Gratis</a>
  </div>

  <div class="card premium">
    <h3>PREMIUM</h3>
    <div class="price">Rp29.000</div>
    <ul>
      <li>✓ Semua Materi</li>
      <li>✓ Quiz Unlimited</li>
      <li>✓ AI Assistant</li>
      <li>✓ Cloud Sync</li>
    </ul>
    <a href="checkout.html" class="btn">Berlangganan</a>
  </div>

</div>

<footer>
  © 2026 Nexora Premium
</footer>

</body>
</html>
